<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMLGuard | SAML Assertion Viewer</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header id="navbar"></header>

    <main>
        <div class="container">
            <div class="card" style="padding: 2.5rem;">
                <span class="eyebrow">IdP Response</span>
                <h1 class="heading-lg">SAML Assertion</h1>
                <p class="subtext">Generated by SAMLGuard Identity Provider</p>

                <div class="grid grid-cols-2" style="margin-top: 2.5rem; gap: 2rem;">
                    <div class="card" style="background-color: var(--bg-dark); padding: 1.75rem;">
                        <h2 class="eyebrow" style="color: var(--text-secondary); margin-bottom: 1.5rem;">Assertion Information</h2>
                        <div class="kv-row">
                            <span class="kv-label">Issuer</span>
                            <span class="kv-value">SAMLGuard Identity Provider</span>
                        </div>
                        <div class="kv-row">
                            <span class="kv-label">Subject</span>
                            <span class="kv-value">Authenticated User</span>
                        </div>
                        <div class="kv-row">
                            <span class="kv-label">Version</span>
                            <span class="kv-value">2.0</span>
                        </div>
                        <div class="kv-row" style="border-bottom: none; margin-bottom: 0; padding-bottom: 0;">
                            <span class="kv-label">Status</span>
                            <span class="badge badge-teal">Valid</span>
                        </div>
                    </div>

                    <div class="card" style="background-color: var(--bg-dark); padding: 1.75rem; overflow: auto; max-height: 400px;">
                        <h2 class="eyebrow" style="color: var(--text-secondary); margin-bottom: 1rem;">Raw XML</h2>
                        <pre id="rawXml" class="font-mono text-teal" style="font-size: 0.75rem; white-space: pre-wrap; line-height: 1.6;">Loading XML...</pre>
                    </div>
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 2.5rem;">
                    <button id="backDashboardBtn" class="btn btn-primary" style="width: auto; padding: 0.75rem 1.5rem;">Back to Dashboard</button>
                    <button id="copyXmlBtn" class="btn btn-secondary" style="width: auto; padding: 0.75rem 1.5rem;">Copy XML</button>
                </div>
            </div>
        </div>
    </main>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/assertion.js"></script>
</body>
</html>
