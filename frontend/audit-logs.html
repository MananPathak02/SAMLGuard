<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMLGuard | Security Audit Logs</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header id="navbar"></header>

    <main>
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2.5rem;">
                <div>
                    <span class="eyebrow">Admin Console</span>
                    <h1 class="heading-lg">Security Audit Logs</h1>
                    <p class="subtext" style="font-size: 0.875rem; margin-top: 0.25rem;">
                        Monitor authentication events and SAML security attack detection.
                    </p>
                </div>
                <button id="backAdminBtn" class="btn btn-secondary" style="width: auto; padding: 0.75rem 1.25rem;">
                    Back to Dashboard
                </button>
            </div>

            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th style="width: 50px;">#</th>
                            <th>Event</th>
                            <th style="width: 150px;">Status</th>
                        </tr>
                    </thead>
                    <tbody id="logTableBody">
                        <tr>
                            <td colSpan="3" style="text-align: center; padding: 2rem; color: var(--text-secondary);" class="font-mono">
                                Loading audit logs...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/audit.js"></script>
</body>
</html>
