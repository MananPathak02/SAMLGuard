<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMLGuard | Login</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header id="navbar"></header>

    <main class="center-screen">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 2rem;">
                <span class="eyebrow">SAMLGuard</span>
                <h1 class="heading-md">Identity Provider Login</h1>
                <p class="subtext" style="font-size: 0.875rem; margin-top: 0.5rem;">
                    Authenticate to generate a SAML assertion
                </p>
            </div>

            <div class="card" style="padding: 2rem;">
                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label" for="email">Email</label>
                        <input type="email" id="email" class="form-input" placeholder="you@company.com" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                    </div>

                    <button type="submit" id="loginBtn" class="btn btn-primary" style="margin-top: 0.5rem; padding: 0.875rem;">
                        Authenticate →
                    </button>
                </form>

                <p id="errorMessage" style="color: var(--accent-red); margin-top: 1.25rem; font-family: var(--font-mono); font-size: 0.875rem; border-top: 1px solid var(--border-color); padding-top: 1rem; display: none;"></p>
            </div>

            <p class="font-mono text-muted" style="font-size: 0.75rem; text-align: center; margin-top: 1.5rem;">
                SAML 2.0 · Binding: HTTP-POST · RSA-SHA256
            </p>
        </div>
    </main>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/login.js"></script>
</body>
</html>
